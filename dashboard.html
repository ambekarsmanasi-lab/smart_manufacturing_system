<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PLANT-01 :: OT Monitoring Console</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    /* Architecture-inspired dark base */
    --bg: #08080a;          /* near-black charcoal */
    --bg-grid: #101013;     /* subtle grid lines */
    --panel: #141418;       /* card / panel */
    --panel-border: #26262c;/* borders */
    --line-header: #18181d; /* section headers */

    /* Muted accent palette */
    --cyan: #8b97a3;        /* cool steel gray */
    --cyan-dim: rgba(139,151,163,0.10);

    --amber: #c9a050;       /* muted brass */
    --amber-dim: rgba(201,160,80,0.10);

    --green: #6aa97a;       /* soft sage */
    --green-dim: rgba(106,169,122,0.10);

    --red: #c06055;         /* rust-red */
    --red-dim: rgba(192,96,85,0.12);

    /* Text colors tuned to dark grays */
    --text: #e5e5e2;        /* off-white, not harsh */
    --text-dim: #8e8e94;    /* dim label */
    --text-faint: #4a4a50;  /* very faint */

    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    --sans: 'Segoe UI', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      linear-gradient(var(--bg-grid) 1px, transparent 1px) 0 0 / 100% 28px,
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px) 0 0 / 28px 100%,
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    padding: 20px 28px 40px;
    min-height: 100vh;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--panel-border);
    padding-bottom: 14px;
    margin-bottom: 18px;
  }

  .brand { display: flex; align-items: baseline; gap: 10px; }

  .brand-mark {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--cyan);
    background: var(--cyan-dim);
    border: 1px solid rgba(139,151,163,0.35);
    padding: 3px 8px;
    border-radius: 2px;
    letter-spacing: 1px;
  }

  h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.3px; margin: 0; color: #ecece9; }

  .subtitle { color: var(--text-dim); font-size: 12px; font-family: var(--mono); margin-top: 3px; }

  #clock { font-family: var(--mono); font-size: 13px; color: var(--text-dim); text-align: right; }

  #clock .live {
    color: var(--green);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    letter-spacing: 0.5px;
  }

  .live::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: blink 1.6s infinite;
  }

  @keyframes blink { 50% { opacity: 0.25; } }

  .summary-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--panel-border);
    border: 1px solid var(--panel-border);
    margin-bottom: 24px;
  }

  .summary-cell { background: var(--panel); padding: 14px 18px; }

  .summary-value { font-family: var(--mono); font-size: 26px; font-weight: 600; color: var(--cyan); }

  .summary-label {
    font-size: 10.5px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-top: 4px;
  }

  .line-block { margin-bottom: 30px; }

  .line-header {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--line-header);
    border: 1px solid var(--panel-border);
    border-bottom: none;
    padding: 8px 14px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  .line-header .tag { color: var(--cyan); font-weight: 600; }

  .machine-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    border: 1px solid var(--panel-border);
  }

  .card {
    background: var(--panel);
    padding: 16px 18px;
    border-right: 1px solid var(--panel-border);
    border-top: 1px solid var(--panel-border);
    position: relative;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }

  .machine-name { font-size: 14px; font-weight: 600; color: #ecece9; }

  .machine-type {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-top: 2px;
  }

  .status-chip {
    font-family: var(--mono);
    font-size: 10.5px;
    padding: 3px 8px;
    border-radius: 2px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 600;
    border: 1px solid transparent;
  }

  .status-running { background: var(--green-dim); color: var(--green); border-color: rgba(106,169,122,0.35); }
  .status-idle    { background: var(--amber-dim); color: var(--amber); border-color: rgba(201,160,80,0.35); }
  .status-down, .status-fault { background: var(--red-dim); color: var(--red); border-color: rgba(192,96,85,0.35); }

  .oee-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }

  .oee-value { font-family: var(--mono); font-size: 32px; font-weight: 700; line-height: 1; }

  .oee-tag { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.6px; }

  canvas.spark { width: 100% !important; height: 36px !important; margin: 8px 0 10px; }

  .metrics {
    display: flex;
    gap: 14px;
    font-family: var(--mono);
    padding-top: 10px;
    border-top: 1px dashed var(--panel-border);
    margin-bottom: 10px;
  }

  .metric-v { font-size: 13px; font-weight: 600; }
  .metric-l { font-size: 9.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }

  .sensor-strip { display: flex; flex-wrap: wrap; gap: 6px; }

  .sensor-chip {
    font-family: var(--mono);
    font-size: 10.5px;
    background: #0f0f13;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    padding: 3px 7px;
    border-radius: 2px;
  }

  .sensor-chip b { color: var(--text); }

  .reason-note { font-family: var(--mono); font-size: 10.5px; color: var(--red); margin-top: 8px; }

  /* ---------- MAINTENANCE PANEL ---------- */
  .maint-panel {
    border: 1px solid var(--panel-border);
    margin-top: 10px;
  }

  .maint-header {
    background: var(--line-header);
    border-bottom: 1px solid var(--panel-border);
    padding: 8px 14px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.8px;
    text-transform: uppercase;
  }

  .maint-header .tag { color: var(--cyan); font-weight: 600; }

  table.maint-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 12px;
  }

  table.maint-table th {
    text-align: left;
    padding: 8px 14px;
    color: var(--text-dim);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--panel-border);
    background: var(--panel);
  }

  table.maint-table td {
    padding: 8px 14px;
    border-bottom: 1px solid var(--panel-border);
    background: var(--panel);
    color: var(--text);
  }

  table.maint-table tr:last-child td { border-bottom: none; }

  .maint-status {
    padding: 2px 7px;
    border-radius: 2px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }

  .maint-overdue { background: var(--red-dim); color: var(--red); }
  .maint-in_progress { background: var(--amber-dim); color: var(--amber); }
  .maint-scheduled { background: var(--cyan-dim); color: var(--cyan); }

  .maint-empty {
    padding: 16px;
    text-align: center;
    color: var(--text-faint);
    font-family: var(--mono);
    font-size: 12px;
    background: var(--panel);
  }

  #error-banner {
    display: none;
    background: var(--red-dim);
    color: var(--red);
    border: 1px solid rgba(192,96,85,0.3);
    padding: 12px 16px;
    font-family: var(--mono);
    font-size: 12px;
    margin-bottom: 20px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="brand-mark">OT-CONSOLE</span>
    <div>
      <h1>PLANT-01 Monitoring Console</h1>
      <div class="subtitle">smart_manufacturing_ot :: live feed</div>
    </div>
  </div>
  <div id="clock">
    <div class="live">LIVE</div>
    <div id="clock-time">--:--:--</div>
  </div>
</div>

<div id="error-banner">
  UPLINK FAILURE — cannot reach API at <code>http://localhost:8080</code>. Confirm backend_app.py is running.
</div>

<div class="summary-strip" id="summary-strip"></div>
<div id="line-groups"></div>

<div class="maint-panel">
  <div class="maint-header"><span class="tag">MAINTENANCE</span> :: upcoming &amp; overdue checks</div>
  <div id="maint-body"></div>
</div>

<script>
const API_BASE = "http://localhost:8080";
const REFRESH_MS = 2000;
const HISTORY_LEN = 24;

const history = {};
const charts = {};

function fmtPct(v) { return v == null ? '—' : (v * 100).toFixed(1) + '%'; }

function getVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function oeeColor(oee) {
  if (oee == null) return getVar('--text-dim');
  if (oee >= 0.85) return getVar('--green');
  if (oee >= 0.60) return getVar('--amber');
  return getVar('--red');
}

function sensorLabel(type) { return type.replace(/_/g, ' '); }

function tickClock() {
  document.getElementById('clock-time').textContent = new Date().toLocaleTimeString();
}
setInterval(tickClock, 1000);
tickClock();

function renderSummary(oeeData, statusData) {
  const running = statusData.filter(s => s.status === 'running').length;
  const alarms = statusData.filter(s => s.status === 'down' || s.status === 'fault').length;
  const avgOee = oeeData.reduce((sum, m) => sum + (Number(m.oee) || 0), 0) / (oeeData.length || 1);

  const cells = [
    { value: fmtPct(avgOee), label: 'Plant Avg OEE', alarm: false },
    { value: `${running} / ${statusData.length}`, label: 'Machines Running', alarm: false },
    { value: alarms, label: 'Active Alarms', alarm: alarms > 0 },
    { value: oeeData.length, label: 'Machines Online', alarm: false },
  ];

  document.getElementById('summary-strip').innerHTML = cells.map(c => `
    <div class="summary-cell">
      <div class="summary-value" style="color:${c.alarm ? getVar('--red') : getVar('--cyan')}">${c.value}</div>
      <div class="summary-label">${c.label}</div>
    </div>
  `).join('');
}

function updateHistory(machine) {
  if (!history[machine.machine_id]) history[machine.machine_id] = [];
  const arr = history[machine.machine_id];
  arr.push(machine.oee || 0);
  if (arr.length > HISTORY_LEN) arr.shift();
  return arr;
}

function renderSparkline(canvasId, data, color) {
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;

  if (charts[canvasId]) {
    charts[canvasId].data.labels = data.map((_, i) => i);
    charts[canvasId].data.datasets[0].data = data;
    charts[canvasId].data.datasets[0].borderColor = color;
    charts[canvasId].update('none');
    return;
  }

  charts[canvasId] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: data.map((_, i) => i),
      datasets: [{
        data: data,
        borderColor: color,
        borderWidth: 1.5,
        pointRadius: 0,
        tension: 0.3,
        fill: false,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      scales: { x: { display: false }, y: { display: false, min: 0, max: 1 } },
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
    }
  });
}

function renderMaintenance(maintData) {
  const body = document.getElementById('maint-body');

  if (!maintData.length) {
    body.innerHTML = `<div class="maint-empty">No upcoming or overdue checks — all clear.</div>`;
    return;
  }

  const rows = maintData.map(check => `
    <tr>
      <td>${check.machine_name}</td>
      <td>${check.check_type}</td>
      <td>${check.scheduled_date}</td>
      <td><span class="maint-status maint-${check.status}">${check.status.replace('_',' ')}</span></td>
      <td>${check.technician || '—'}</td>
    </tr>
  `).join('');

  body.innerHTML = `
    <table class="maint-table">
      <thead>
        <tr><th>Machine</th><th>Type</th><th>Scheduled</th><th>Status</th><th>Technician</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function renderCard(machine, statusMap, sensorMap) {
  const statusInfo = statusMap[machine.machine_id] || {};
  const status = statusInfo.status || 'unknown';
  const accent = oeeColor(machine.oee);
  const canvasId = `spark-${machine.machine_id}`;
  const sensors = sensorMap[machine.machine_id] || [];

  const sensorChips = sensors.map(s =>
    `<span class="sensor-chip">${sensorLabel(s.sensor_type)}: <b>${Number(s.value).toFixed(1)}</b></span>`
  ).join('');

  const reasonNote = (status === 'down' || status === 'fault') && statusInfo.reason_code
    ? `<div class="reason-note">⚠ ${statusInfo.reason_code.replace(/_/g, ' ')}</div>`
    : '';

  return `
    <div class="card">
      <div class="card-top">
        <div>
          <div class="machine-name">${machine.machine_name}</div>
          <div class="machine-type">${machine.machine_type.replace(/_/g, ' ')}</div>
        </div>
        <span class="status-chip status-${status}">${status}</span>
      </div>

      <div class="oee-row">
        <span class="oee-value" style="color:${accent}">${fmtPct(machine.oee)}</span>
        <span class="oee-tag">OEE</span>
      </div>

      <canvas class="spark" id="${canvasId}"></canvas>

      <div class="metrics">
        <div><div class="metric-v">${fmtPct(machine.availability)}</div><div class="metric-l">Avail</div></div>
        <div><div class="metric-v">${fmtPct(machine.performance)}</div><div class="metric-l">Perf</div></div>
        <div><div class="metric-v">${fmtPct(machine.quality)}</div><div class="metric-l">Qual</div></div>
      </div>

      <div class="sensor-strip">${sensorChips}</div>
      ${reasonNote}
    </div>
  `;
}

async function refreshDashboard() {
  try {
    const [oeeRes, statusRes, sensorRes, maintRes] = await Promise.all([
      fetch(`${API_BASE}/api/oee`),
      fetch(`${API_BASE}/api/status`),
      fetch(`${API_BASE}/api/sensors`),
      fetch(`${API_BASE}/api/maintenance`)
    ]);

    if (!oeeRes.ok || !statusRes.ok || !sensorRes.ok || !maintRes.ok) throw new Error('API error');

    const oeeData = await oeeRes.json();
    const statusData = await statusRes.json();
    const sensorData = await sensorRes.json();
    const maintData = await maintRes.json();

    const statusMap = {};
    statusData.forEach(s => { statusMap[s.machine_id] = s; });

    const sensorMap = {};
    sensorData.forEach(s => {
      if (!sensorMap[s.machine_id]) sensorMap[s.machine_id] = [];
      sensorMap[s.machine_id].push(s);
    });

    renderSummary(oeeData, statusData);
    renderMaintenance(maintData);

    const lineGroups = {};
    oeeData.forEach(m => {
      if (!lineGroups[m.line_name]) lineGroups[m.line_name] = [];
      lineGroups[m.line_name].push(m);
    });

    const container = document.getElementById('line-groups');
    container.innerHTML = Object.entries(lineGroups).map(([lineName, machines]) => `
      <div class="line-block">
        <div class="line-header"><span class="tag">${lineName}</span> :: ${machines.length} machines</div>
        <div class="machine-row">
          ${machines.map(m => renderCard(m, statusMap, sensorMap)).join('')}
        </div>
      </div>
    `).join('');

    oeeData.forEach(m => {
      const arr = updateHistory(m);
      renderSparkline(`spark-${m.machine_id}`, arr, oeeColor(m.oee));
    });

    document.getElementById('error-banner').style.display = 'none';

  } catch (err) {
    document.getElementById('error-banner').style.display = 'block';
    console.error(err);
  }
}

refreshDashboard();
setInterval(refreshDashboard, REFRESH_MS);
</script>

</body>
</html>
